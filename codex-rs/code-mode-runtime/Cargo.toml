[package]
edition.workspace = true
license.workspace = true
name = "codex-code-mode-runtime"
version.workspace = true

[lib]
doctest = false
name = "codex_code_mode_runtime"
path = "src/lib.rs"

[lints]
workspace = true

[features]
# illumos port note: published rusty_v8 release archives are non-sandboxed,
# and upstream builds its sandbox-enabled V8 archives with Bazel. Enable this
# feature only when linking a sandbox-enabled V8 archive yourself (for example
# via RUSTY_V8_ARCHIVE); the default Cargo build uses the published
# non-sandboxed archives, which is what `codex-code-mode-host` remote
# deployments built by this port link against.
v8-sandbox = ["v8/v8_enable_sandbox"]

[dependencies]
codex-code-mode-protocol = { workspace = true }
codex-protocol = { workspace = true }
deno_core_icudata = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
v8 = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
